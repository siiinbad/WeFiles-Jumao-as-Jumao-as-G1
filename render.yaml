services:
  - type: web
    name: wefiles
    runtime: python
    plan: free
    branch: main
    autoDeployTrigger: commit
    buildCommand: bash build.sh
    startCommand: >-
      gunicorn config.wsgi:application
      --bind 0.0.0.0:$PORT
      --workers 2
      --threads 2
      --timeout 120
      --access-logfile -
      --access-logformat '%(m)s %(s)s %(L)s'
      --error-logfile -
    healthCheckPath: /health/ready/
    envVars:
      # Supply a stable random value of at least 50 characters.
      - key: SECRET_KEY
        sync: false
      - key: DATABASE_URL
        sync: false
      - key: DEBUG
        value: "False"
      - key: DATABASE_POOL_MODE
        value: auto
      - key: TRUST_PROXY_HTTPS
        value: "True"
      - key: TIME_ZONE
        value: Asia/Manila
      - key: SUPABASE_S3_ENDPOINT_URL
        sync: false
      - key: SUPABASE_S3_REGION
        sync: false
      - key: SUPABASE_STORAGE_BUCKET
        sync: false
      - key: SUPABASE_S3_ACCESS_KEY_ID
        sync: false
      - key: SUPABASE_S3_SECRET_ACCESS_KEY
        sync: false
