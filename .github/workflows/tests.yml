name: Django checks
on:
  pull_request:
    branches: [develop, main]
  push:
    branches: [develop, "feature/**"]
jobs:
  postgres-tests:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_DB: wefiles_test
          POSTGRES_USER: wefiles
          POSTGRES_PASSWORD: ci-only-password
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U wefiles -d wefiles_test"
          --health-interval 5s --health-timeout 5s --health-retries 10
    env:
      SECRET_KEY: ci-only-not-a-production-secret-xxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxx
      DJANGO_DEBUG: "True"
      PRIVATE_STORAGE_BACKEND: local
      DATABASE_URL: postgresql://offline:offline@127.0.0.1:5432/wefiles_offline
      TEST_DATABASE_URL: postgresql://wefiles:ci-only-password@127.0.0.1:5432/wefiles_test
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version-file: .python-version
          cache: pip
      - run: python -m pip install -r requirements.txt
      - run: python -m unittest discover -s scripts -p "test_configure_local.py"
      - run: python manage.py check --settings=config.test_settings
      - run: python manage.py makemigrations --check --dry-run --settings=config.test_settings
      - run: python manage.py test --settings=config.test_settings --parallel 1
      - run: python manage.py collectstatic --noinput --settings=config.test_settings

  fresh-clone-setup:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version-file: .python-version
          cache: pip
      - run: python -m pip install -r requirements.txt
      - run: python scripts/configure_local.py
      - run: docker compose config --quiet
      - run: docker compose up -d --wait db
      - run: python manage.py migrate --noinput
      - run: python manage.py check --database default
      - run: python manage.py collectstatic --noinput
      - if: always()
        run: docker compose down
